[project]
name = "datashield-tidyverse"
version = "0.1.0"
description = "DataSHIELD Tidyverse Client implementation in Python"
readme = "README.md"
authors = [
    { name = "Yannick Marcon", email = "yannick.marcon@obiba.org" }
]
requires-python = ">=3.11"
dependencies = [
    "datashield>=0.5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.2.2",
]
dev = [
    "ruff>=0.10.0",
]

[project.urls]
Homepage = "https://www.datashield.org"
Repository = "https://github.com/obiba/datashield-tidyverse"
Documentation = "https://obiba.org/datashield-tidyverse"
"Bug Tracker" = "https://github.com/obiba/datashield-tidyverse/issues"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
